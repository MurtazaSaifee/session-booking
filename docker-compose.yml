services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build:
      context: .
      target: app
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://booking:booking@db:5432/booking
      JWT_SECRET: dev-only-secret
      NODE_ENV: production
      SECURE_COOKIES: "false"
      SEED_DEMO_DATA: "true"
      # No value here: passed through from the shell if set, otherwise the app uses its default.
      DB_POOL_MAX:
      BACKGROUND_CHECK_SECONDS:

  test:
    build:
      context: .
      target: test
    profiles: ["test"]
    pull_policy: build
    depends_on:
      db:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgres://booking:booking@db:5432/booking_test

volumes:
  db-data:
