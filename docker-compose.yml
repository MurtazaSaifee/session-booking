services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking"]
      interval: 2s
      timeout: 3s
      retries: 15

  test:
    build:
      context: .
      target: test
    profiles: ["test"]
    pull_policy: build
    depends_on:
      db:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgres://booking:booking@db:5432/booking_test

volumes:
  db-data:
