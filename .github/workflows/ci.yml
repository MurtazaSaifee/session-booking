name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: booking
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U booking"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgres://booking:booking@localhost:5433/booking_test
        run: npm test

      - name: Typecheck infrastructure
        working-directory: infra
        run: npm ci && npm run typecheck
